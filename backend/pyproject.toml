[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentscope-ai-backend"
version = "0.1.0.dev1"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2", "asyncpg>=0.30,<1", "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1", "greenlet>=3.1,<4", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3",
  "opentelemetry-proto>=1.29,<2", "protobuf>=5,<8",
  "sqlalchemy[asyncio]>=2.0.36,<3", "structlog>=24.4,<26", "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "mypy>=1.14,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
