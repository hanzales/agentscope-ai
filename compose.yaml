services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentscope}
      POSTGRES_USER: ${POSTGRES_USER:-agentscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentscope}"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AGENTSCOPE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentscope}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentscope}
      AGENTSCOPE_DEMO_MODE: ${AGENTSCOPE_DEMO_MODE:-true}
      AGENTSCOPE_ADMIN_TOKEN: ${AGENTSCOPE_ADMIN_TOKEN:-}
      AGENTSCOPE_WEBHOOK_SIGNING_SECRET: ${AGENTSCOPE_WEBHOOK_SIGNING_SECRET:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker", "--interval", "3600"]
    environment:
      AGENTSCOPE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentscope}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentscope}
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
